<div id="browser-outdated-and-not-ie" style="display: none;">
</div>
<script type="text/javascript">

    var linkFirefox = 'http://www.mozilla.org/pt-BR/firefox/fx/';
    var linkChrome = 'https://www.google.com/chrome/index.html?hl=pt-BR&brand=CHMB&utm_campaign=pt-_br&utm_source=pt-br-ha-latam-br-sk&utm_medium=ha';



    if ( navigator.appName == "Microsoft Internet Explorer" ) {
        montaDoisLinks();
    } else {
        var isChrome = navigator.userAgent.toLowerCase().indexOf( 'chrome' ) > -1;
        var isFirefox = navigator.userAgent.toLowerCase().indexOf( 'firefox' ) > -1;

        if ( isChrome ) {
            var int = navigator.userAgent.toLowerCase().indexOf( 'chrome' );
            var outdatedChrome = navigator.userAgent.substr( int + 7, 2 );
            if ( parseInt( outdatedChrome, 100) < 19 ) {
                montaLinkChrome();
            }
        } else if ( isFirefox ) {
            var int = navigator.userAgent.toLowerCase().indexOf( 'firefox' );
            var outdatedFirefox = navigator.userAgent.substr( int + 8, 2 );
            if ( parseInt(outdatedFirefox, 100) < 12 ) {
                montaLinkFirefox();
            }
        } else {
            montaDoisLinks();
        }
    }
    function montaLinkFirefox()
    {
        $( '#browser-outdated-and-not-ie' ).html( "Seu navegador estï¿½ desatualizado. Para atualiza-lo " +
                "<a target='_blank' href='" + linkFirefox + "'>click aqui</a>! " +
                "Ver os <a target='_blank' href='/aluno/login/requisitossistema.action' >Requisitos do sistema</a>!" );
        $( '#browser-outdated-and-not-ie' ).show( "fast" );
    }
    function montaLinkChrome()
    {
        $( '#browser-outdated-and-not-ie' ).html( "Seu navegador estï¿½ desatualizado. Para atualiza-lo " +
                "<a target='_blank' href='" + linkChrome + "'>click aqui</a>! " +
                "Ver os <a target='_blank' href='/aluno/login/requisitossistema.action' >Requisitos do sistema</a>!" );
        $( '#browser-outdated-and-not-ie' ).show( "fast" );
    }
    function montaDoisLinks()
    {
        $( '#browser-outdated-and-not-ie' ).html( "Para um melhor funcionamento utilize o " +
                "<a target='_blank' href='" + linkFirefox + "'>Mozilla Firefox</a> ou " +
                "<a target='_blank' href='" + linkChrome + "'>Google Chrome</a>. " +
                "Ver os <a target='_blank' href='/aluno/login/requisitossistema.action' >Requisitos do sistema</a>!" );
        $( '#browser-outdated-and-not-ie' ).show( "fast" );
    }
</script>
