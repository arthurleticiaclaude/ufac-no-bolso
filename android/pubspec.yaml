name: ufac_no_bolso
description: "Portal do Aluno e RU da Ufac num app só. App independente, não oficial."
publish_to: 'none'

version: 0.1.13+14

environment:
  sdk: ^3.13.7

dependencies:
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_file_dialog: ^3.3.5
  flutter_inappwebview: 6.2.0-beta.3
  flutter_local_notifications: ^23.0.0
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  html: ^0.15.7
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.11
  share_plus: ^13.3.1
  sqflite: ^2.4.5
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.12.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icone.png

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf

flutter_launcher_icons:
  android: true
  image_path: assets/icon/icone.png
  adaptive_icon_background: "#0B4FA8"
  adaptive_icon_foreground: assets/icon/icone_frente.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#0B4FA8"
  image: assets/icon/icone_frente.png
  android_12:
    color: "#0B4FA8"
    image: assets/icon/icone_frente.png
